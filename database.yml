development:
  dialect: "mysql"
  database: "consolidation"
  host: "localhost"
  port: "3306"
  user: "creaves"
  password: "creaves"
  # Cap the dev pool (same rationale as creaves/database.yml): unlimited
  # pooled connections accumulate across e2e runs → MySQL Error 1040.
  pool: 25
  idlepool: 5
  connmaxlifetime: 10m
  connmaxidletime: 1m

test:
  dialect: "sqlite"
  database: "consolidation_test.sqlite"

production:
  dialect: "mysql"
  # Same convention as creaves/database.yml: point the container at any
  # remote db/port by exporting DATABASE_URL before starting it.
  url: {{envOr "DATABASE_URL" "mysql://consolidation:consolidation@(localhost:3306)/consolidation?parseTime=true&multiStatements=true&readTimeout=3s"}}
