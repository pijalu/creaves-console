development:
  dialect: "mysql"
  database: "consolidation"
  host: "localhost"
  port: "3306"
  user: "creaves"
  password: "creaves"
  # Cap the dev pool (same rationale as creaves/database.yml): unlimited
  # pooled connections accumulate across e2e runs → MySQL Error 1040.
  pool: 25
  idlepool: 5
  connmaxlifetime: 10m
  connmaxidletime: 1m

test:
  dialect: "sqlite"
  database: "consolidation_test.sqlite"

production:
  dialect: "mysql"
  database: {{envOr "DB_NAME" "consolidation"}}
  host: {{envOr "DB_HOST" "localhost"}}
  port: {{envOr "DB_PORT" "3307"}}
  user: {{envOr "DB_USER" "consolidation"}}
  password: {{envOr "DB_PASSWORD" "consolidation"}}
