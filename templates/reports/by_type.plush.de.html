<div class="row">
    <div class="col-md-12">
        <h1><i class="fas fa-paw"></i> Bericht nach Typ</h1>
        <p class="lead">Verteilung der Tiere nach Typ</p>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-12">
        <a href="/reports?instance_id=<%= instanceID %>" class="btn btn-secondary">Zurück zu den Berichten</a>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Typ</th>
                        <th class="text-right">Gesamt</th>
                        <th class="text-right">In Pflege</th>
                        <th class="text-right">Freigelassen</th>
                        <th class="text-right">Verstorben</th>
                        <th>Verteilung</th>
                    </tr>
                </thead>
                <tbody>
                    <%= for (r) in results { %>
                        <tr>
                            <td><strong><%= tlabel_localized(r.AnimalType, localizedLabels) %></strong></td>
                            <td class="text-right"><span class="badge badge-dark"><%= r.Count %></span></td>
                            <td class="text-right"><span class="badge badge-success"><%= r.InCare %></span></td>
                            <td class="text-right"><span class="badge badge-primary"><%= r.Released %></span></td>
                            <td class="text-right"><span class="badge badge-danger"><%= r.Died %></span></td>
                            <td>
                                <div class="progress" style="height: 20px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: <%= r.InCare * 100 / r.Count %>%"></div>
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: <%= r.Released * 100 / r.Count %>%"></div>
                                    <div class="progress-bar bg-danger" role="progressbar" style="width: <%= r.Died * 100 / r.Count %>%"></div>
                                </div>
                            </td>
                        </tr>
                    <% } %>
                </tbody>
            </table>
        </div>
    </div>
</div>
