<div class="row">
    <div class="col-md-12">
        <h1><i class="fas fa-paw"></i> Rapport par type</h1>
        <p class="lead">Répartition des animaux par type</p>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-12">
        <form method="GET" action="/reports/by_type" class="form-inline">
            <div class="form-group mr-2">
                <label for="instance_id" class="mr-2">Centre :</label>
                <select name="instance_id" id="instance_id" class="form-control" onchange="this.form.submit()">
                    <%= for (i) in instances { %>
                        <option value="<%= i.InstanceID %>" <%= if (i.Selected) { %>selected<% } %>><%= if (i.InstanceID == "") { %>Tous les centres<% } else { %><%= i.Name %> (<%= i.InstanceID %>)<% } %></option>
                    <% } %>
                </select>
            </div>
            <noscript><button class="btn btn-primary">Appliquer</button></noscript>
        </form>
    </div>
</div>

<div class="row mb-3">
    <div class="col-md-12">
        <a href="/reports?instance_id=<%= instanceID %>" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Retour aux rapports</a>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="thead-dark">
                    <tr>
                        <th>Type</th>
                        <th class="text-right">Total</th>
                        <th class="text-right">En soins</th>
                        <th class="text-right">Relâchés</th>
                        <th class="text-right">Décédés</th>
                        <th>Répartition</th>
                    </tr>
                </thead>
                <tbody>
                    <%= for (r) in results { %>
                        <tr>
                            <td><strong><%= tlabel_localized(r.AnimalType, localizedLabels) %></strong></td>
                            <td class="text-right"><span class="badge badge-dark"><%= r.Count %></span></td>
                            <td class="text-right"><span class="badge badge-success"><%= r.InCare %></span></td>
                            <td class="text-right"><span class="badge badge-primary"><%= r.Released %></span></td>
                            <td class="text-right"><span class="badge badge-danger"><%= r.Died %></span></td>
                            <td>
                                <div class="progress" style="height: 20px;">
                                    <div class="progress-bar bg-success" role="progressbar" style="width: <%= r.InCare * 100 / r.Count %>%"></div>
                                    <div class="progress-bar bg-primary" role="progressbar" style="width: <%= r.Released * 100 / r.Count %>%"></div>
                                    <div class="progress-bar bg-danger" role="progressbar" style="width: <%= r.Died * 100 / r.Count %>%"></div>
                                </div>
                            </td>
                        </tr>
                    <% } %>
                </tbody>
            </table>
        </div>
    </div>
</div>
