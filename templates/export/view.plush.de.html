<div class="row">
    <div class="col-md-12">
        <h1><i class="fas fa-file-export"></i> <%= query.Description %></h1>
        <p class="lead"><code><%= query.Name %></code> — <%= len(rows) %> Zeile(n).</p>
    </div>
</div>

<div class="row mt-2 mb-3">
    <div class="col-md-8">
        <form method="get" action="/export/reports/view" class="form-inline">
            <input type="hidden" name="query" value="<%= query.Name %>">
            <label for="instance_id" class="mr-2">Zentrum:</label>
            <select name="instance_id" id="instance_id" class="form-control" onchange="this.form.submit()">
                <%= for (i) in instances { %>
                    <option value="<%= i.InstanceID %>" <%= if (i.Selected) { %>selected<% } %>><%= if (i.InstanceID == "") { %>Alle Zentren<% } else { %><%= i.Name %> (<%= i.InstanceID %>)<% } %></option>
                <% } %>
            </select>
        </form>
    </div>
    <div class="col-md-4 text-right">
        <a class="btn btn-success" href="/export/reports/export.csv?query=<%= query.Name %>&amp;instance_id=<%= instanceID %>"><i class="fas fa-download"></i> CSV herunterladen</a>
        <a class="btn btn-secondary" href="/export/reports?instance_id=<%= instanceID %>"><i class="fas fa-arrow-left"></i> Alle Berichte</a>
    </div>
</div>

<div class="row mb-2">
    <div class="col-md-4">
        <input type="text" id="exportFilter" class="form-control" placeholder="Zeilen filtern…" onkeyup="filterExportTable()">
    </div>
</div>

<div class="row">
    <div class="col-md-12 table-responsive">
        <table class="table table-striped table-hover table-sm" id="exportTable">
            <thead class="thead-dark">
                <tr>
                    <%= for (idx, col) in cols { %>
                        <th><a href="javascript:void(0)" class="text-light" onclick="sortExportTable(<%= idx %>)"><%= col %> <i class="fas fa-sort"></i></a></th>
                    <% } %>
                </tr>
            </thead>
            <tbody>
                <%= for (row) in rows { %>
                    <tr>
                        <%= for (cell) in row { %>
                            <td><%= cell %></td>
                        <% } %>
                    </tr>
                <% } %>
            </tbody>
        </table>
    </div>
</div>

<script>
function filterExportTable() {
    var filter = document.getElementById("exportFilter").value.toLowerCase();
    var rows = document.querySelectorAll("#exportTable tbody tr");
    rows.forEach(function(r) {
        r.style.display = r.textContent.toLowerCase().indexOf(filter) > -1 ? "" : "none";
    });
}
function sortExportTable(col) {
    var table = document.getElementById("exportTable");
    var tbody = table.tBodies[0];
    var rows = Array.from(tbody.rows);
    var asc = table.getAttribute("data-sort-col") != String(col) || table.getAttribute("data-sort-dir") == "desc";
    rows.sort(function(a, b) {
        var x = a.cells[col].textContent.trim(), y = b.cells[col].textContent.trim();
        var nx = parseFloat(x.replace(",", ".")), ny = parseFloat(y.replace(",", "."));
        var cmp = (!isNaN(nx) && !isNaN(ny) && x !== "" && y !== "") ? nx - ny : x.localeCompare(y, undefined, {numeric: true});
        return asc ? cmp : -cmp;
    });
    rows.forEach(function(r) { tbody.appendChild(r); });
    table.setAttribute("data-sort-col", String(col));
    table.setAttribute("data-sort-dir", asc ? "asc" : "desc");
}
</script>
