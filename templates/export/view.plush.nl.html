<div class="row">
    <div class="col-md-12">
        <h1><a href="/export/reports?instance_id=<%= instanceID %>" title="Terug naar rapporten" class="mr-2"><i class="fas fa-arrow-left"></i></a> <%= query.Description %></h1>
        <p class="lead"><code><%= query.Name %></code> — <%= len(rows) %> rij(en).</p>
    </div>
</div>

<div class="row mt-2 mb-3">
    <div class="col-md-8">
        <form method="get" action="/export/reports/view" class="form-inline">
            <input type="hidden" name="query" value="<%= query.Name %>">
            <label for="instance_id" class="mr-2">Centrum:</label>
            <select name="instance_id" id="instance_id" class="form-control" onchange="this.form.submit()">
                <%= for (i) in instances { %>
                    <option value="<%= i.InstanceID %>" <%= if (i.Selected) { %>selected<% } %>><%= if (i.InstanceID == "") { %>Alle centra<% } else { %><%= i.Name %> (<%= i.InstanceID %>)<% } %></option>
                <% } %>
            </select>
        </form>
    </div>
    <div class="col-md-4 text-right">
        <a class="btn btn-success" href="/export/reports/export.csv?query=<%= query.Name %>&amp;instance_id=<%= instanceID %>"><i class="fas fa-download"></i> CSV downloaden</a>
    </div>
</div>

<div class="row">
    <div class="col-md-12 mb-1">
        <button type="button" id="toggleColumnFilters" class="btn btn-outline-secondary btn-sm" aria-pressed="false"><i class="fas fa-filter"></i> Filters</button>
    </div>
</div>

<div class="row">
    <div class="col-md-12 table-responsive">
        <table class="table table-striped table-hover table-sm" id="exportTable" style="width:100%">
            <thead class="thead-dark">
                <tr>
                    <%= for (col) in cols { %>
                        <th><%= col %></th>
                    <% } %>
                </tr>
                <tr class="column-filters" style="display:none">
                    <%= for (col) in cols { %>
                        <th><input type="search" class="form-control form-control-sm column-filter" placeholder="<%= col %>" aria-label="Filter <%= col %>"></th>
                    <% } %>
                </tr>
            </thead>
            <tbody>
                <%= for (row) in rows { %>
                    <tr>
                        <%= for (cell) in row { %>
                            <td><%= cell %></td>
                        <% } %>
                    </tr>
                <% } %>
            </tbody>
        </table>
    </div>
</div>

<script>
// bugs.md datatable item: DataTables (CDN assets loaded at end of body in the
// layout) replaces the hand-rolled sort/filter JS. This template renders
// before the layout's jQuery <script> tag, so init waits for DOMContentLoaded.
// deferRender renders only the visible page: sort/filter operate on the data
// cache, not a 10k-row DOM.
document.addEventListener('DOMContentLoaded', function () {
    // French decimal-comma numbers ("1,5") sort numerically.
    DataTable.type('num-comma', {
        detect: function (d) {
            return /^-?\d+([.,]\d+)?$/.test((d || '').trim()) ? 'num-comma' : null;
        },
        order: {
            pre: function (d) {
                return parseFloat((d || '').trim().replace(',', '.')) || 0;
            }
        },
        className: 'dt-body-right'
    });
    var table = $('#exportTable').DataTable({
        deferRender: true,
        // Keep sorting on the title row: the second header row holds the
        // per-column filter inputs.
        orderCellsTop: true,
        pageLength: 50,
        lengthMenu: [25, 50, 100, 250, 500],
        language: {
                "search": "Zoeken:",
                "lengthMenu": "_MENU_ resultaten weergeven",
                "info": "_START_ tot _END_ van _TOTAL_ resultaten",
                "infoEmpty": "Geen resultaten om weer te geven",
                "infoFiltered": " (gefilterd uit _MAX_ resultaten)",
                "zeroRecords": "Geen resultaten gevonden",
                "emptyTable": "Geen resultaten aanwezig in de tabel",
                "loadingRecords": "Een moment geduld aub - bezig met laden...",
                "processing": "Verwerken...",
                "paginate": {
                        "first": "Eerste",
                        "last": "Laatste",
                        "next": "Volgende",
                        "previous": "Vorige"
                }
        }
    });
    // Per-column filters (case-insensitive "contains", the DataTables
    // default): the filter row is hidden until the Filters button toggles it.
    $('#exportTable thead tr.column-filters input.column-filter').on('keyup change', function () {
        table.column($(this).closest('th').index()).search(this.value).draw();
    });
    $('#toggleColumnFilters').on('click', function () {
        var row = $('#exportTable thead tr.column-filters');
        var show = !row.is(':visible');
        row.css('display', show ? 'table-row' : 'none');
        $(this).toggleClass('active', show).attr('aria-pressed', show);
    });
});
</script>
