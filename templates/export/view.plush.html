<div class="row">
    <div class="col-md-12">
        <h1><a href="/export/reports?instance_id=<%= instanceID %>" title="Back to reports" class="mr-2"><i class="fas fa-arrow-left"></i></a> <%= query.Description %></h1>
        <p class="lead"><code><%= query.Name %></code> — <%= len(rows) %> row(s).</p>
    </div>
</div>

<style>
/* Table-tools bar: sits directly above the table, aligned right,
   wraps to the next line instead of overflowing on narrow screens. */
.export-view-toolbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    flex-wrap: wrap;
    gap: .25rem;
    margin-bottom: .5rem;
}
.export-view-toolbar input[type="search"] {
    width: 12rem;
    max-width: 100%;
    border-radius: 2rem;
}
</style>

<div class="row mt-2 mb-3">
    <div class="col-md-12">
        <form method="get" action="/export/reports/view" class="form-inline">
            <input type="hidden" name="query" value="<%= query.Name %>">
            <label for="instance_id" class="mr-2">Center:</label>
            <select name="instance_id" id="instance_id" class="form-control" onchange="this.form.submit()">
                <%= for (i) in instances { %>
                    <option value="<%= i.InstanceID %>" <%= if (i.Selected) { %>selected<% } %>><%= if (i.InstanceID == "") { %>All centers<% } else { %><%= i.Name %> (<%= i.InstanceID %>)<% } %></option>
                <% } %>
            </select>
        </form>
    </div>
</div>

<div class="export-view-toolbar" role="toolbar" aria-label="Table tools">
    <button type="button" id="toggleColumnFilters" class="btn btn-outline-secondary btn-sm" aria-pressed="false" title="Show/hide per-column filters" data-toggle="tooltip" data-placement="bottom"><i class="fas fa-filter"></i></button>
    <input type="search" id="exportGlobalSearch" class="form-control form-control-sm" placeholder="Search…" aria-label="Search all columns" title="Search all columns" data-toggle="tooltip" data-placement="bottom">
    <a class="btn btn-outline-secondary btn-sm" href="/export/reports/export.csv?query=<%= query.Name %>&amp;instance_id=<%= instanceID %>" title="Download CSV" data-toggle="tooltip" data-placement="bottom"><i class="fas fa-download"></i></a>
</div>

<div class="row">
    <div class="col-md-12 table-responsive">
        <table class="table table-striped table-hover table-sm" id="exportTable" style="width:100%">
            <thead class="thead-dark">
                <tr>
                    <%= for (col) in cols { %>
                        <th><%= col %></th>
                    <% } %>
                </tr>
                <tr class="column-filters" style="display:none">
                    <%= for (col) in cols { %>
                        <th><input type="search" class="form-control form-control-sm column-filter" placeholder="<%= col %>" aria-label="Filter <%= col %>"></th>
                    <% } %>
                </tr>
            </thead>
            <tbody>
                <%= for (row) in rows { %>
                    <tr>
                        <%= for (cell) in row { %>
                            <td><%= cell %></td>
                        <% } %>
                    </tr>
                <% } %>
            </tbody>
        </table>
    </div>
</div>

<script>
// bugs.md datatable item: DataTables (vendored assets loaded at end of body in the
// layout) replaces the hand-rolled sort/filter JS. This template renders
// before the layout's jQuery <script> tag, so init waits for DOMContentLoaded.
// deferRender renders only the visible page: sort/filter operate on the data
// cache, not a 10k-row DOM.
document.addEventListener('DOMContentLoaded', function () {
    // French decimal-comma numbers ("1,5") sort numerically.
    DataTable.type('num-comma', {
        detect: function (d) {
            return /^-?\d+([.,]\d+)?$/.test((d || '').trim()) ? 'num-comma' : null;
        },
        order: {
            pre: function (d) {
                return parseFloat((d || '').trim().replace(',', '.')) || 0;
            }
        },
        className: 'dt-body-right'
    });
    var table = $('#exportTable').DataTable({
        deferRender: true,
        // Keep sorting on the title row: the second header row holds the
        // per-column filter inputs.
        orderCellsTop: true,
        // Global search lives in the floating toolbar (#exportGlobalSearch):
        // hide the built-in DataTables filter box (no "f" in dom).
        dom: 'lrtip',
        pageLength: 50,
        lengthMenu: [25, 50, 100, 250, 500]
    });
    // Per-column filters (case-insensitive "contains", the DataTables
    // default): the filter row is hidden until the Filters button toggles it.
    $('#exportTable thead tr.column-filters input.column-filter').on('keyup change', function () {
        table.column($(this).closest('th').index()).search(this.value).draw();
    });
    // Floating toolbar: global search across all columns.
    $('#exportGlobalSearch').on('keyup change', function () {
        table.search(this.value).draw();
    });
    // Icon-only buttons get Bootstrap tooltips.
    $('.export-view-toolbar [data-toggle="tooltip"]').tooltip();
    $('#toggleColumnFilters').on('click', function () {
        var row = $('#exportTable thead tr.column-filters');
        var show = !row.is(':visible');
        row.css('display', show ? 'table-row' : 'none');
        $(this).toggleClass('active', show).attr('aria-pressed', show);
    });
});
</script>
