<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Clé API créée</h1>

        <div class="alert alert-warning mt-4">
            <strong>Important :</strong> c'est la seule fois où la clé API complète est affichée.
            Copiez-la maintenant et conservez-la en sécurité &mdash; elle ne pourra plus être récupérée plus tard.
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><%= webhookAPIKey.Name %></h5>
            </div>
            <div class="card-body">
                <label for="raw-api-key"><strong>Votre clé API :</strong></label>
                <div class="input-group">
                    <input type="text" class="form-control text-monospace" id="raw-api-key" readonly value="<%= rawKey %>" onclick="this.select()">
                    <div class="input-group-append">
                        <button class="btn btn-primary" type="button" id="copy-api-key-btn" onclick="copyApiKey()">Copier</button>
                    </div>
                </div>
            </div>
            <div class="card-footer">
                <a href="/webhook_api_keys/<%= webhookAPIKey.ID %>" class="btn btn-secondary">Continuer vers les détails de la clé</a>
                <a href="/webhook_api_keys" class="btn btn-outline-secondary">Retour à la liste</a>
            </div>
        </div>
    </div>
</div>

<script>
function copyApiKey() {
    var input = document.getElementById('raw-api-key');
    input.focus();
    input.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(input.value);
    } else {
        document.execCommand('copy');
    }
}
</script>
