<div class="row">
    <div class="col-md-8 offset-md-2">
        <h1>Webhook-API-Schlüssel bearbeiten</h1>

        <%= form_for(webhookAPIKey, {action: "/webhook_api_keys/"+webhookAPIKey.ID, method: "PUT"}) { %>
            <%= f.InputTag("Name", {label: "Schlüsselname"}) %>
            <%= f.InputTag("InstanceID", {label: "Instanz-ID"}) %>
            
            <div class="form-group form-check">
                <input type="hidden" name="Active" value="false" />
                <input type="checkbox" class="form-check-input" id="active" name="Active" value="true" <%= if (webhookAPIKey.Active) { %>checked<% } %>>
                <label class="form-check-label" for="active">Aktiv</label>
            </div>
            
            <div class="form-group">
                <button class="btn btn-primary" type="submit">Aktualisieren</button>
                <a href="/webhook_api_keys/<%= webhookAPIKey.ID %>" class="btn btn-secondary">Abbrechen</a>
            </div>
        <% } %>
    </div>
</div>
