version: '3.8'

services:
  consolidation-db:
    image: mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: consolidation
      MYSQL_USER: consolidation
      MYSQL_PASSWORD: consolidation
    volumes:
      - consolidation_db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - consolidation-network

  consolidation-web:
    build: .
    environment:
      GO_ENV: production
      ADDR: 0.0.0.0
      PORT: "3001"
      DATABASE_URL: mysql://consolidation:consolidation@(consolidation-db:3306)/consolidation?parseTime=true&multiStatements=true&readTimeout=3s
    ports:
      - "3001:3001"
    depends_on:
      - consolidation-db
    networks:
      - consolidation-network
    # Default CMD (dockerscript/quickstart.prod.sh) runs migrations +
    # db:seed, then starts the web server — same pattern as creaves.

volumes:
  consolidation_db_data:

networks:
  consolidation-network:
    driver: bridge
